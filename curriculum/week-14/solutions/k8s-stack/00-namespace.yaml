apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    # Pod Security Standards. `restricted` is the strictest built-in profile.
    # Start with `warn`+`audit` to see what WOULD break, then move to `enforce`.
    # See week 19 -- enforcing cluster-wide without exclusions locks you out.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: shop-quota
  namespace: shop
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "4"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: shop-defaults
  namespace: shop
spec:
  limits:
    # Defaults so nobody ships an unbounded pod. With a ResourceQuota in place,
    # a pod with NO requests is REJECTED -- LimitRange supplies them silently.
    - type: Container
      default:        { cpu: 200m, memory: 256Mi }
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      max:            { cpu: "1",  memory: 1Gi }
