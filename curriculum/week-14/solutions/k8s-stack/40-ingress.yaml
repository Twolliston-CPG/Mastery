apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: shop
  annotations:
    projectcontour.io/response-timeout: "30s"
spec:
  # Without ingressClassName the controller IGNORES this resource entirely,
  # which presents as a 404 and sends people hunting in the wrong place.
  ingressClassName: contour
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app      # must be in THIS namespace -- Ingress backends
                port:          # are namespace-local (BF-49)
                  name: http
