apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: shop
data:
  LOG_LEVEL: "info"
  PORT: "8080"
  app.conf: |
    # non-secret application configuration
    max_connections = 20
    request_timeout = 30
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: shop
type: Opaque
stringData:
  # DEMO ONLY. In week 16 this comes from AWS Secrets Manager via the
  # External Secrets Operator, and this manifest disappears entirely.
  # Never commit a real value: base64 in etcd is ENCODING, not encryption.
  POSTGRES_USER: app
  POSTGRES_PASSWORD: change-me-locally
  POSTGRES_DB: appdb
