apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-app
  namespace: shop
automountServiceAccountToken: false   # the app does not call the Kubernetes API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: shop
  labels: { app: app }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # never drop below desired capacity
  selector:
    matchLabels: { app: app }
  template:
    metadata:
      labels: { app: app }
    spec:
      serviceAccountName: shop-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # Spread replicas across nodes so losing one node does not lose the service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: app }
      initContainers:
        # Same job as compose's `depends_on: condition: service_healthy`.
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z db.shop.svc.cluster.local 5432; do
                echo "waiting for database..."; sleep 2
              done
              echo "database reachable"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: app
          # Replace with your week-4 image.
          image: ghcr.io/REPLACE_ME/week04-app:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db.shop.svc.cluster.local:5432/$(POSTGRES_DB)
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: db-credentials, key: POSTGRES_DB } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          # startup: protects a slow boot without weakening liveness forever
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 5
          # liveness: is the PROCESS wedged? Checks NOTHING external.
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness: can it SERVE? This one checks the database.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Give the endpoints controller time to remove this pod from the
              # Service before the process starts shutting down. Without it,
              # in-flight requests are routed to a terminating pod.
              exec: { command: ["sh", "-c", "sleep 5"] }
          volumeMounts:
            - { name: tmp,    mountPath: /tmp }
            - { name: config, mountPath: /etc/app, readOnly: true }
      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: app-config
            items:
              - { key: app.conf, path: app.conf }
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: shop
spec:
  type: ClusterIP
  selector:
    app: app                 # MUST match the pod template labels (BF-47)
  ports:
    - name: http
      port: 80
      targetPort: http       # named port: survives a containerPort change
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: app }
