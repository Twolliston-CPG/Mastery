# Alertmanager routing.
#
# Two ideas worth studying here:
#  1. severity=page and severity=ticket go to DIFFERENT places. If everything
#     pages, nothing does.
#  2. inhibit_rules suppress downstream noise. One root cause producing fifteen
#     alerts is how a real incident becomes unreadable.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'namespace', 'job']
  group_wait: 30s        # collect related alerts before the first notification
  group_interval: 5m     # then batch subsequent ones
  repeat_interval: 4h    # re-notify about a still-firing alert this often
  receiver: default

  routes:
    - matchers:
        - severity = "page"
      receiver: pagerduty
      group_wait: 10s        # pages are urgent; batch less
      repeat_interval: 1h

    - matchers:
        - severity = "ticket"
      receiver: slack-alerts
      repeat_interval: 12h

    # Watchdog: an alert that ALWAYS fires. If it stops arriving, the alerting
    # pipeline itself is broken -- which is otherwise silent and terrifying.
    - matchers:
        - alertname = "Watchdog"
      receiver: deadmansswitch
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 5m

inhibit_rules:
  # If the whole service is gone, do not also page about latency and errors.
  - source_matchers:
      - alertname = "TargetDisappeared"
    target_matchers:
      - severity =~ "page|ticket"
    equal: ['job']

  # A page supersedes a ticket for the same thing.
  - source_matchers:
      - severity = "page"
    target_matchers:
      - severity = "ticket"
    equal: ['alertname', 'job']

receivers:
  - name: default
    slack_configs:
      - channel: '#alerts-default'
        send_resolved: true

  - name: pagerduty
    pagerduty_configs:
      - service_key: '<REPLACE>'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          runbook: '{{ .CommonAnnotations.runbook_url }}'

  - name: slack-alerts
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ .CommonLabels.alertname }}'
        text: >-
          {{ .CommonAnnotations.summary }}
          {{ if .CommonAnnotations.runbook_url }}
          Runbook: {{ .CommonAnnotations.runbook_url }}
          {{ end }}

  - name: deadmansswitch
    webhook_configs:
      - url: 'https://healthchecks.io/ping/<REPLACE>'
