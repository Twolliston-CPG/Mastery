# Week 4 deliverable: nginx (TLS) -> flask/gunicorn -> postgres
# Start:  make up      Verify: make verify     Stop: make down
name: week04-stack

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    restart: unless-stopped
    networks: [backend]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "8080"
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy   # wait for READY, not just started
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    read_only: true                  # immutable filesystem
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    restart: unless-stopped
    networks: [backend, frontend]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    restart: unless-stopped
    networks: [frontend]

volumes:
  pgdata:

networks:
  frontend:
  backend:
    internal: true      # db is NOT reachable from outside the compose network
