version: 2
# cooldown: a release must be at least 7 days old before Dependabot proposes it. Most hijacked
# packages and actions are caught within days; this keeps the first wave out of the PR queue.
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: terraform
    directories:
      - /infra/github
      - /curriculum/_setup/aws-lab
      - /curriculum/_setup/aws-lab/state
      - /curriculum/_setup/gcp-lab
      - /curriculum/_setup/gcp-lab/state
      - /curriculum/_setup/gcp-lab/image
      - /curriculum/projects/alpha-cloud-foundation/bootstrap
      - /curriculum/projects/alpha-cloud-foundation/environments/dev
      - /curriculum/projects/alpha-cloud-foundation/environments/prod
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    # One pull request per provider across every root above, instead of one per root. The first
    # weekly run produced eight separate PRs for two provider bumps; a provider's roots must move
    # together anyway, because the Alpha modules and environments share one constraint line.
    groups:
      terraform-providers:
        patterns: ["*"]
    commit-message:
      prefix: "infra"

  # The pinned figure toolchain that the figures-fresh job installs.
  - package-ecosystem: pip
    directory: /curriculum/_shared/diagrams
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  # Hash-locked scanner pins installed by security.yml. Dependabot regenerates the hashes.
  - package-ecosystem: pip
    directory: /.github/requirements
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    ignore:
      # checkov (3.3.29, the newest release) hard-pins asteval==1.0.6; the patched 1.0.9 cannot be
      # installed next to it, so every Dependabot security run for asteval fails with
      # "security_update_not_possible". The fix arrives as a checkov release that lifts the pin
      # (upstream: bridgecrewio/checkov#7504, PR #7517); that bump regenerates this lock and is NOT
      # ignored here. Remove this entry when checkov's asteval requirement is >= 1.0.9.
      - dependency-name: asteval
