name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR pushes cancel the previous run; a run on main always completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners: ubuntu-24.04-arm, pinned (ubuntu-latest moves to 26.04 in November 2026). Every tool
# is installed through ./.github/actions/fetch-tool with a per-architecture checksum, or from a
# hash-locked requirements file, so nothing depends on what the image happens to ship.
env:
  # Keep in step with .pre-commit-config.yaml. Checksums from gitleaks_<ver>_checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256_AMD64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
  # The Ubuntu 24.04 runner images do not ship Terraform, and hashicorp/setup-terraform is not a
  # GitHub-authored action (infra/github/actions.tf allows nothing else). Checksums from the
  # release's SHA256SUMS file.
  TERRAFORM_VERSION: 1.15.8
  TERRAFORM_SHA256_AMD64: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d
  TERRAFORM_SHA256_ARM64: 8891e9dcedc9e3b8950bc6af9d4d8af1f4cfade3062f53b9dc403a89f6ce8c9c

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still a leak
          persist-credentials: false

      - uses: ./.github/actions/fetch-tool
        with:
          name: gitleaks
          url-amd64: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          url-arm64: https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_arm64.tar.gz
          sha256-amd64: ${{ env.GITLEAKS_SHA256_AMD64 }}
          sha256-arm64: ${{ env.GITLEAKS_SHA256_ARM64 }}
          version-flag: version

      - name: Scan full git history
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  content-checks:
    name: content-checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mermaid, Markdown structure, relative links (authored layers)
        run: python3 curriculum/_shared/diagrams/check-diagrams.py

      - name: Same checks on the reference library (skipped by a default run)
        run: python3 curriculum/_shared/diagrams/check-diagrams.py curriculum/_reference

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/fetch-tool
        with:
          name: terraform
          url-amd64: https://releases.hashicorp.com/terraform/${{ env.TERRAFORM_VERSION }}/terraform_${{ env.TERRAFORM_VERSION }}_linux_amd64.zip
          url-arm64: https://releases.hashicorp.com/terraform/${{ env.TERRAFORM_VERSION }}/terraform_${{ env.TERRAFORM_VERSION }}_linux_arm64.zip
          sha256-amd64: ${{ env.TERRAFORM_SHA256_AMD64 }}
          sha256-arm64: ${{ env.TERRAFORM_SHA256_ARM64 }}
          version-flag: version

      # One job, not a matrix: the job name is a required status check in
      # infra/github/rulesets.tf, and a matrix would rename it per root.
      - name: fmt -check (every .tf in the repository)
        run: terraform fmt -check -recursive -diff

      - name: init + validate every root module
        run: |
          set -euo pipefail
          roots=(
            infra/github
            curriculum/_setup/aws-lab
            curriculum/_setup/aws-lab/state
            curriculum/_setup/gcp-lab
            curriculum/_setup/gcp-lab/state
            curriculum/_setup/gcp-lab/image
            curriculum/projects/alpha-cloud-foundation/bootstrap
            curriculum/projects/alpha-cloud-foundation/environments/dev
            curriculum/projects/alpha-cloud-foundation/environments/prod
          )
          rc=0
          for d in "${roots[@]}"; do
            echo "::group::$d"
            if terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null \
               && terraform -chdir="$d" validate -no-color; then
              echo "ok"
            else
              echo "::error::terraform validate failed in $d"; rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  figures-fresh:
    name: figures-fresh
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned figure toolchain (hash-locked)
        run: python3 -m pip install --quiet --require-hashes -r curriculum/_shared/diagrams/requirements.txt

      # The week specs are the source; FIGURE.md and the README sections are generated from them.
      # --docs-only needs neither Graphviz nor Chrome, so this proves "nobody hand-edited a
      # generated file" without re-rendering images on a runner whose Graphviz may differ.
      - name: Regenerate FIGURE.md and README sections from the specs
        run: python3 curriculum/_shared/diagrams/generate-week-figures.py --docs-only

      - name: Fail if a committed generated file differs from its spec
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat -- 'curriculum/week-*/README.md' 'curriculum/week-*/content/FIGURE.md'; then
            echo "::error::generated figure docs are stale. Edit the spec in curriculum/_shared/diagrams/week_figures/, run generate-week-figures.py, and commit the result."
            exit 1
          fi
