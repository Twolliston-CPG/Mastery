name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .pre-commit-config.yaml. Checksum is for gitleaks_<ver>_linux_x64.tar.gz.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still a leak
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  content-checks:
    name: content-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mermaid + Markdown structure (whole repo, no browser)
        run: python3 curriculum/_shared/diagrams/check-diagrams.py

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-24.04 # Terraform is preinstalled on GitHub-hosted Ubuntu runners
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: terraform version
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color
