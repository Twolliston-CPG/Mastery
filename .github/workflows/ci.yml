name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with .pre-commit-config.yaml. Checksum is for gitleaks_<ver>_linux_x64.tar.gz.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # The ubuntu-24.04 runner image does not ship Terraform, and hashicorp/setup-terraform is not a
  # GitHub-authored action (infra/github/actions.tf allows nothing else), so it is installed the
  # same way as gitleaks. Checksum is for terraform_<ver>_linux_amd64.zip from the SHA256SUMS file.
  TERRAFORM_VERSION: 1.15.8
  TERRAFORM_SHA256: d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d

jobs:
  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret deleted in a later commit is still a leak
          persist-credentials: false

      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version

      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  content-checks:
    name: content-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Mermaid, Markdown structure, relative links (authored layers)
        run: python3 curriculum/_shared/diagrams/check-diagrams.py

      - name: Same checks on the reference library (skipped by a default run)
        run: python3 curriculum/_shared/diagrams/check-diagrams.py curriculum/_reference

  terraform-validate:
    name: terraform-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/terraform" version

      # One job, not a matrix: the job name is a required status check in
      # infra/github/rulesets.tf, and a matrix would rename it per root.
      - name: fmt -check (every .tf in the repository)
        run: terraform fmt -check -recursive -diff

      - name: init + validate every root module
        run: |
          set -euo pipefail
          roots=(
            infra/github
            curriculum/_setup/aws-lab
            curriculum/_setup/aws-lab/state
            curriculum/_setup/gcp-lab
            curriculum/_setup/gcp-lab/state
            curriculum/_setup/gcp-lab/image
            curriculum/projects/alpha-cloud-foundation/bootstrap
            curriculum/projects/alpha-cloud-foundation/environments/dev
            curriculum/projects/alpha-cloud-foundation/environments/prod
          )
          rc=0
          for d in "${roots[@]}"; do
            echo "::group::$d"
            if terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null \
               && terraform -chdir="$d" validate -no-color; then
              echo "ok"
            else
              echo "::error::terraform validate failed in $d"; rc=1
            fi
            echo "::endgroup::"
          done
          exit $rc

  figures-fresh:
    name: figures-fresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the pinned figure toolchain
        run: python3 -m pip install -r curriculum/_shared/diagrams/requirements.txt

      # The week specs are the source; FIGURE.md and the README sections are generated from them.
      # --docs-only needs neither Graphviz nor Chrome, so this proves "nobody hand-edited a
      # generated file" without re-rendering images on a runner whose Graphviz may differ.
      - name: Regenerate FIGURE.md and README sections from the specs
        run: python3 curriculum/_shared/diagrams/generate-week-figures.py --docs-only

      - name: Fail if a committed generated file differs from its spec
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat -- 'curriculum/week-*/README.md' 'curriculum/week-*/content/FIGURE.md'; then
            echo "::error::generated figure docs are stale. Edit the spec in curriculum/_shared/diagrams/week_figures/, run generate-week-figures.py, and commit the result."
            exit 1
          fi
