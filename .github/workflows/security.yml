name: security

# Security checks that complement ci.yml:
#   secrets        -> ci.yml `secrets-scan` (gitleaks, full history)
#   workflows      -> actions-lint  (actionlint + zizmor)
#   shell          -> shell-lint    (shellcheck on every tracked .sh)
#   IaC            -> iac-scan      (checkov + trivy on the whole repository: the Terraform that
#                                    touches real accounts, the workflows, and the teaching
#                                    projects and solutions, which are held to the same bar)
#
# Tools are pinned by version and, for binaries, by sha256. Only GitHub-authored actions are
# used because infra/github/actions.tf allows nothing else to run with the repository token.
# Nothing is uploaded to code scanning: SARIF upload on a private repository needs GitHub
# Advanced Security, so reports are kept as workflow artifacts instead.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 1" # Mondays: scanners gain rules weekly, so re-scan main without a commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CHECKOV_VERSION: 3.3.29
  ZIZMOR_VERSION: 1.31.1
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 # actionlint_<ver>_linux_amd64.tar.gz
  TRIVY_VERSION: 0.76.0
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7 # trivy_<ver>_Linux-64bit.tar.gz

jobs:
  actions-lint:
    name: actions-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install actionlint (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -version

      # Syntax, expression types, runner labels, and (through the preinstalled shellcheck)
      # every `run:` script in every workflow.
      - name: actionlint
        run: ./actionlint -no-color -shellcheck shellcheck .github/workflows/*.yml

      # Supply-chain posture of the workflows themselves: unpinned actions, template injection,
      # credential persistence, cache poisoning, known-vulnerable action versions.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }} # read-only; lets zizmor resolve tags for the online audits
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          zizmor --version
          zizmor --persona regular .github/workflows

  shell-lint:
    name: shell-lint
    runs-on: ubuntu-24.04 # shellcheck is preinstalled on GitHub-hosted Ubuntu runners
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck every tracked shell script (warning and above)
        run: |
          set -euo pipefail
          shellcheck --version | head -2
          git ls-files -z -- '*.sh' | xargs -0 shellcheck -S warning

  iac-scan:
    name: iac-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install checkov (pinned)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov --version

      - name: Install trivy (pinned release, checksum verified)
        run: |
          set -euo pipefail
          curl -fsSLo trivy.tgz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          ./trivy --version

      # Everything checkov understands here: Terraform, Dockerfiles, Kubernetes manifests, the
      # workflows, and secrets. Every suppression is an inline `checkov:skip` comment (Terraform)
      # or a `checkov.io/skip` annotation (Kubernetes) on the resource it excuses, with its reason.
      # .checkov.yaml holds only frameworks and skip-paths.
      - name: checkov
        run: |
          set -euo pipefail
          mkdir -p reports
          checkov --config-file .checkov.yaml --directory . \
            --output cli --output sarif --output-file-path console,reports/checkov.sarif

      # Terraform exceptions are inline `#trivy:ignore` comments; the Kubernetes ones (no inline
      # form) are in .trivyignore.yaml, which trivy only reads when told to.
      - name: trivy misconfiguration scan (HIGH, CRITICAL)
        run: |
          set -euo pipefail
          ./trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-version-check \
            --ignorefile .trivyignore.yaml \
            --skip-dirs curriculum/_reference --skip-dirs _figures --skip-dirs _backups \
            .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: iac-scan-reports
          path: reports/
          retention-days: 14
