# checkov configuration shared by .github/workflows/security.yml and local runs:
#   checkov --config-file .checkov.yaml -d .        # the whole repository; what blocks a merge
#
# No `skip-check` here on purpose. A check that is wrong for one resource is suppressed on that
# resource with an inline `# checkov:skip=CKV_...: reason` comment, so the reason lives next to
# the code it excuses and shows up in review.
framework:
  - terraform
  - dockerfile
  - kubernetes
  - github_actions
  - secrets
# Paths are regular expressions matched against each file's path. Checkov matches them against
# the path relative to the scanned directory, not the working directory, so patterns here never
# start with a parent such as `curriculum/`.
skip-path:
  - _reference # 623 anonymized Markdown files; nothing to scan, slow to walk
  - _figures # generated PNGs
  - _backups # gitignored pre-git snapshots
  # Platform service definitions (`kind: Service` in the charlie-platform schema) and the
  # template they come from are not Kubernetes manifests; checkov misreads them as one.
  - charlie-platform/services
  - _shared/templates
quiet: true
compact: true
