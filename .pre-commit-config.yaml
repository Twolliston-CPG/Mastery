# Local guardrails that run before anything reaches GitHub.
#   pre-commit install            # once per clone; installs BOTH the pre-commit and pre-push hooks
#   pre-commit run --all-files    # whole tree
#
# Deliberately NO formatters/fixers (trailing-whitespace, end-of-file-fixer): a first run would
# rewrite ~1,000 content files. Only checks that block bad commits.
#
# Stages: every hook runs at commit time unless it says otherwise. The one pre-push hook refuses
# a direct push to main; that is the review requirement (PR + green CI) enforced on the client
# while the server-side ruleset in infra/github/rulesets.tf is unavailable on the Free plan.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # keep in step with GITLEAKS_VERSION in .github/workflows/ci.yml
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        # Four reference files show an OpenSSH key header followed by "..." as a placeholder
        # (or mention the marker in a regex). Reviewed 2026-10-10; nothing in them is a key.
        exclude: |
          (?x)^(
            curriculum/_reference/kubernetes/04-platform/01-gitops-argocd-exercises-01-argocd-setup\.md|
            curriculum/_reference/linux-networking/python/PYTHON_DEVOPS_ROADMAP\.md|
            curriculum/_reference/cicd-gitops/argocd/ARGOCD_MASTERY_ROADMAP\.md|
            curriculum/_reference/cicd-gitops/argocd/phase-7-security-README\.md
          )$
      - id: check-added-large-files
        args: ["--maxkb=5120"] # 5 MB; GitHub warns at 50 MB and refuses at 100 MB
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        files: ^(\.github/|\.pre-commit-config\.yaml)
      - id: check-json
        files: ^(\.github/|infra/)

  - repo: local
    hooks:
      - id: no-direct-push-to-main
        name: refuse a direct push to main (open a pull request instead)
        entry: >-
          bash -c 'case "${PRE_COMMIT_REMOTE_BRANCH:-}" in refs/heads/main)
          echo "main is protected by review: push a branch and open a pull request. (--no-verify bypasses; the ruleset will not.)" >&2;
          exit 1;; esac'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
      - id: shellcheck
        name: shellcheck -S warning
        entry: shellcheck -S warning
        language: system
        files: \.sh$
      - id: terraform-fmt
        name: terraform fmt -check (every root)
        entry: terraform fmt -check -recursive .
        language: system
        files: \.tf$
        pass_filenames: false
      - id: mermaid-structure
        name: check-diagrams.py on changed Markdown
        entry: python3 curriculum/_shared/diagrams/check-diagrams.py
        language: system
        files: \.md$
        pass_filenames: true
